<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ibrahim Ali Portfolio</title>
<meta name="description" content="Ibrahim Ali — art director portfolio: brand identity, campaigns and packaging.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: white gallery wall. One 1320px column, hairline-divided rows, mono labels index sections; the work carries the colour. */
:root{
  --bg:#FFFFFF; --surface:#F5F5F4; --fg:#111111; --muted:#6F6F6B; --line:#E7E6E3;
  --btn-bg:#111111; --btn-fg:#FFFFFF; --scrim:rgba(255,255,255,.97);
  --header-bg:rgba(255,255,255,.9); --veil:rgba(255,255,255,.82); --field-line:#D5D4D0; --danger:#B42318; --danger-line:#F1C5C0;
  --sans:"Geist","Helvetica Neue",Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --max:1320px; --radius:12px;
  color-scheme:light;
}
/* Dark theme: opt-in from the header toggle; light stays the default */
:root[data-theme="dark"]{
  --bg:#0B0B0B; --surface:#171716; --fg:#F2F2EF; --muted:#9B9B96; --line:#262625;
  --btn-bg:#F2F2EF; --btn-fg:#0B0B0B; --scrim:rgba(11,11,11,.97);
  --header-bg:rgba(11,11,11,.88); --veil:rgba(11,11,11,.8); --field-line:#3A3A38; --danger:#F97066; --danger-line:#5C2A26;
  color-scheme:dark;
}
html,body,header.site,.mobile-nav,.chip,.filters{transition:background-color .3s,color .3s,border-color .3s}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:4px}

.wrap{max-width:var(--max);margin:0 auto;
  padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
@media (max-width:600px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* Header */
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--header-bg);
  backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent;transition:border-color .3s}
header.site.scrolled{border-bottom-color:var(--line)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:500;letter-spacing:-.01em}
nav.main{display:flex;gap:30px}
nav.main a{color:var(--muted);transition:color .2s}
nav.main a:hover,nav.main a[aria-current="page"]{color:var(--fg)}
.menu-btn{display:none;background:none;border:0;padding:8px 0;cursor:pointer}
.mobile-nav{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.mobile-nav .top{display:flex;justify-content:space-between;align-items:center;height:54px}
.mobile-nav ul{list-style:none;margin:48px 0 0;padding:0;display:grid;gap:6px}
.mobile-nav ul a{font-size:46px;letter-spacing:-.04em;font-weight:500}
.mobile-nav ul a[aria-current="page"]{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:8px}
@media (max-width:720px){nav.main{display:none}.menu-btn{display:block}}
.hdr-right{display:flex;align-items:center;gap:22px}
.theme-btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 10px;border:1px solid var(--line);border-radius:999px;
  background:none;cursor:pointer;font-size:13px;color:var(--muted);transition:color .2s,border-color .2s}
.theme-btn:hover{color:var(--fg);border-color:var(--fg)}
.theme-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
.theme-btn .i-sun{display:none}
:root[data-theme="dark"] .theme-btn .i-sun{display:block}
:root[data-theme="dark"] .theme-btn .i-moon{display:none}
@media (max-width:420px){.theme-btn .t{display:none}.theme-btn{padding:0 9px}}

/* Type */
.label{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.display{font-size:clamp(54px,9.5vw,136px);line-height:.93;letter-spacing:-.05em;font-weight:500;margin:0;text-wrap:balance}
.h2{font-size:clamp(36px,5.4vw,68px);line-height:1;letter-spacing:-.04em;font-weight:500;margin:0;text-wrap:balance}
.h3{font-size:clamp(19px,1.7vw,22px);line-height:1.2;letter-spacing:-.015em;font-weight:500;margin:0}
.lead{font-size:clamp(20px,2.2vw,27px);line-height:1.3;letter-spacing:-.018em;max-width:32ch;margin:0;text-wrap:pretty}
.body{color:var(--muted);max-width:62ch;margin:0}

/* Buttons */
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px;border-radius:999px;border:1px solid var(--fg);
  font-size:15px;cursor:pointer;background:none;transition:transform .2s}
.btn.solid{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.btn:hover{transform:translateY(-1px)}
.btn .arr{font-size:13px;transition:transform .2s}
.btn:hover .arr{transform:translate(2px,-2px)}

/* Sections */
section.block{padding-block:clamp(80px,10vw,140px) 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(32px,4vw,56px)}
.sec-head > div{display:grid;gap:14px}
.hero{padding-block:clamp(56px,9vw,120px) 0;display:grid;gap:28px}
.stats{display:flex;gap:clamp(28px,5vw,72px);flex-wrap:wrap;margin-top:clamp(40px,6vw,72px);border-top:1px solid var(--line);padding-top:22px}
.stats div{display:grid;gap:4px}
.stats b{font-size:clamp(30px,3.6vw,44px);font-weight:500;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}

/* Rows */
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:24px;padding-block:22px;border-bottom:1px solid var(--line)}
.row .v{font-size:18px;letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
a.row{transition:padding .3s}
a.row:hover{padding-left:10px}
@media (max-width:640px){.row{grid-template-columns:1fr;gap:6px}}

/* Image slots: placeholder until an image is uploaded */
.slot{position:relative;width:100%;max-width:100%;aspect-ratio:var(--ar,2/1);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.slot > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot.filled:not(.card-slot) > img{cursor:zoom-in}
.slot.type{aspect-ratio:1/1}
.type-grid{gap:24px}
.type-grid .ph .label{font-size:12px}
.ph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;text-align:center;padding:16px;color:var(--muted);
  background-image:repeating-linear-gradient(135deg,transparent 0 16px,rgba(17,17,17,.028) 16px 17px)}
.ph svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.4;opacity:.7}
.ph .hint{font-size:13px}
.card-slot .ph{gap:6px}
.card-slot .ph svg{width:24px;height:24px}
.slot-tools{position:absolute;top:12px;right:12px;display:flex;gap:6px;opacity:0;transition:opacity .2s}
.slot:hover .slot-tools,.slot:focus-within .slot-tools{opacity:1}
@media (hover:none){.slot-tools{opacity:1}}
.tool{height:34px;padding:0 13px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.tool:hover{border-color:var(--fg)}
.tool.danger{color:var(--danger);border-color:var(--danger-line)}
.ref{position:absolute;left:12px;bottom:12px;margin:0;width:min(26%,170px);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px;display:grid;gap:3px}
.ref img{width:100%;border-radius:5px;display:block}
.ref figcaption{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 2px 1px}
@media (max-width:640px){.ref{display:none}}
.slot.busy::after{content:attr(data-status);position:absolute;inset:0;display:grid;place-items:center;background:var(--veil);
  font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg)}
.slot-msg{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:999px;max-width:calc(100% - 28px);text-align:center}
.edit-note{display:flex;gap:10px;align-items:center;margin:0 0 20px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;font-size:14px;color:var(--muted)}
.edit-note b{color:var(--fg);font-weight:500}

/* Project cards */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px 24px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr));gap:56px 28px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid,.grid.two{grid-template-columns:1fr;gap:40px}}
.card{display:grid;gap:14px;align-content:start}
.card .slot{aspect-ratio:2/1}
.grid.two .card .slot{aspect-ratio:16/9}
.card .slot > img{transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.card:hover .slot > img{transform:scale(1.035)}
.card .meta{display:grid;gap:3px}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.card .ctry{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.card .sub{color:var(--muted);font-size:15px}

/* Projects page */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:44px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:5;
  background:var(--bg);padding-block:12px;margin-bottom:24px}
.chip{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:inline-flex;align-items:center;gap:8px;
  font-size:14px;transition:border-color .2s,background .2s,color .2s}
.chip .c{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chip:hover{border-color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.chip[aria-pressed="true"] .c{color:inherit;opacity:.6}
.group{padding-block:36px 72px;border-top:1px solid var(--line)}
.group-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:36px}
.group-head > div{display:grid;gap:10px}
.group-head p{color:var(--muted);margin:0;max-width:44ch}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:56px 24px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}

/* Project detail */
.back{display:inline-flex;gap:8px;color:var(--muted);font-size:15px;margin-top:36px}
.back:hover{color:var(--fg)}
.detail-head{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px 64px;padding-block:40px 48px;align-items:end}
.detail-head .titles{display:grid;gap:18px}
.detail-head .display{font-size:clamp(46px,7vw,100px)}
.facts{display:grid;gap:0;border-top:1px solid var(--line)}
.facts div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding-block:13px;border-bottom:1px solid var(--line)}
@media (max-width:860px){.detail-head{grid-template-columns:1fr}}
.story{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:24px;padding-block:clamp(48px,6vw,80px);}
.story p{font-size:clamp(19px,1.9vw,23px);line-height:1.45;letter-spacing:-.012em;margin:0 0 1em;max-width:46ch;text-wrap:pretty}
@media (max-width:760px){.story{grid-template-columns:1fr}}
.stack{display:grid;gap:clamp(16px,2.2vw,32px)}
.pager{margin-top:clamp(72px,10vw,120px);display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.pager a{display:grid;gap:8px;padding:28px 0}
.pager a + a{text-align:right;border-left:1px solid var(--line);padding-left:24px}
.pager .h3{font-size:clamp(20px,2.4vw,30px)}
.pager a:hover .h3{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1.5px}

/* Lightbox */
.lightbox{position:fixed;inset:0;z-index:50;background:var(--scrim);display:grid;place-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 56px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 56px) max(16px,env(safe-area-inset-left,0px))}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.lb-btn{position:absolute;background:var(--bg);border:1px solid var(--line);border-radius:999px;height:42px;min-width:42px;padding:0 14px;cursor:pointer}
.lb-close{top:calc(env(safe-area-inset-top,0px) + 10px);right:max(16px,env(safe-area-inset-right,0px))}
.lb-prev{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
.lb-next{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
.lb-count{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:50%;transform:translateX(-50%)}

/* Contact */
.contact-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(32px,6vw,96px);align-items:start;margin-top:clamp(48px,6vw,80px)}
@media (max-width:860px){.contact-grid{grid-template-columns:1fr}}
form.brief{background:var(--surface);border-radius:var(--radius);padding:clamp(20px,3vw,36px);display:grid;gap:24px}
.field{display:grid;gap:10px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:520px){.field-row{grid-template-columns:1fr}}
.field input,.field textarea{width:100%;font:inherit;color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--field-line);
  padding:8px 0;outline:none;transition:border-color .2s;border-radius:0}
.field input:focus,.field textarea:focus{border-color:var(--fg)}
.field textarea{min-height:110px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts label{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--field-line);background:var(--bg);display:inline-flex;align-items:center;font-size:14px;cursor:pointer;transition:all .2s}
.opts input:checked + label{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.opts input:focus-visible + label{outline:2px solid var(--fg);outline-offset:2px}
.form-note{font-size:14px;color:var(--muted);margin:0}
.copy{background:none;border:0;padding:0;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:12px}
.copy:hover{color:var(--fg)}
.todo{color:var(--muted);font-style:italic}

/* Footer */
footer.site{margin-top:clamp(96px,12vw,160px);border-top:1px solid var(--line)}
footer.site .wrap{display:grid;gap:40px;padding-block:56px 40px}
.foot-cta a{font-size:clamp(30px,5vw,64px);letter-spacing:-.045em;font-weight:500;line-height:1}
.foot-cta a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.foot-bottom{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:14px}

/* Motion */
.view{animation:enter .6s cubic-bezier(.2,.7,.2,1) both}
.view .rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.view .rise:nth-child(2){animation-delay:.06s}.view .rise:nth-child(3){animation-delay:.12s}.view .rise:nth-child(4){animation-delay:.18s}
@keyframes enter{from{opacity:.4}to{opacity:1}}
@keyframes rise{from{opacity:.2;filter:blur(8px);transform:translateY(12px)}to{opacity:1;filter:none;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

}

function viewProjects(filter) {
  const chips = [{ id: "all", name: "All", n: PROJECTS.length }]
    .concat(CATEGORIES.map(c => ({ id: c.id, name: c.name, n: catCount(c.id) })));
  const cats = filter === "all" ? CATEGORIES : CATEGORIES.filter(c => c.id === filter);
  return `
  <div class="wrap">
    <section class="hero" style="gap:20px">
      <span class="label rise">Projects — ${PROJECTS.length} in ${countries.length} countries</span>
      <h1 class="display rise">Work</h1>
      <p class="lead rise">Campaigns, brand identities, events and typography.</p>
    </section>
    <div class="filters" role="group" aria-label="Filter projects">
      ${chips.map(c => `<button class="chip" data-filter="${c.id}" aria-pressed="${c.id === filter}">${esc(c.name)} <span class="c">${pad(c.n)}</span></button>`).join("")}
    </div>
    ${cats.map(c => {
      const list = PROJECTS.filter(p => p.cat === c.id);
      return `<section class="group">
        <div class="group-head">
          <div><span class="label">(${pad(CATEGORIES.indexOf(c) + 1)}) ${esc(c.type)}</span><h2 class="h2" style="font-size:clamp(32px,4vw,52px)">${esc(c.name)}</h2></div>
          <p>${esc(c.blurb)}</p>
        </div>
        ${c.id === "typography" ? `<div class="grid type-grid">${TYPO.images.map((_, k) => slot(TYPO, k, "type")).join("")}</div>`
          : `<div class="grid">${list.map(card).join("")}</div>`}
      </section>`;
    }).join("")}
  </div>`;
}

function viewProject(p) {

    <section class="detail-head">
      <div class="titles">
        <span class="label rise">${esc(c.name)} · ${pad(at + 1)} / ${pad(list.length)}</span>

      </div>
      <div class="facts rise">

}

      <div class="rows">
        <div class="row"><span class="label">Email</span><span class="v">${SITE.email ? `<a href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a>` : val("", "Email")}${SITE.email ? `<button class="copy" data-copy="${esc(SITE.email)}">Copy</button>` : ""}</span></div>
        <div class="row"><span class="label">Phone</span><span class="v">${SITE.phone ? `<a href="tel:${SITE.phone.replace(/\s/g, "")}">${esc(SITE.phone)}</a>` : val("", "Phone")}</span></div>
        <div class="row"><span class="label">Social</span><span class="v" style="display:flex;gap:18px;flex-wrap:wrap">${SITE.socials.length ? SITE.socials.map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener">${n} ↗</a>`).join("") : val("", "Links")}</span></div>
      </div>
      <form class="brief" id="brief" novalidate>
        <div class="field-row">
          <div class="field"><label class="label" for="f-name">Your name</label><input id="f-name" autocomplete="name"></div>
          <div class="field"><label class="label" for="f-email">Email</label><input id="f-email" type="email" autocomplete="email"></div>
        </div>
        <div class="field"><label class="label" for="f-company">Company</label><input id="f-company" autocomplete="organization"></div>
        <div class="field"><span class="label">What do you need?</span><div class="opts">${opt("need", needs)}</div></div>
        <div class="field"><label class="label" for="f-msg">Tell me about the project</label><textarea id="f-msg"></textarea></div>
        <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
          <button class="btn solid" type="submit">Send message <span class="arr">↗</span></button>
          <p class="form-note" id="formNote" aria-live="polite"></p>
        </div>
      </form>
    </div>
  </div>`;
}

/* Router: #home  #projects  #projects-branding  #contact  #<project-slug> */
let current = null;
function render() {
  const h = (location.hash || "#home").slice(1);
  let html, nav = "home";
  current = PROJECTS.find(p => p.slug === h) || null;
  if (current) { html = viewProject(current); nav = "projects"; }
  else if (h === "projects" || h.startsWith("projects-")) {
    const f = h.slice(9); html = viewProjects(CATEGORIES.some(c => c.id === f) ? f : "all"); nav = "projects";
  }
  else if (h === "contact") { html = viewContact(); nav = "contact"; }
  else html = viewHome();
  $("#app").innerHTML = `<div class="view">${html}</div>`;
  document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav === nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  closeMenu(); closeLb();
  window.scrollTo({ top: 0, behavior: "instant" });
  bind();
}

function bind() {
  document.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => {
    const f = b.dataset.filter; location.hash = f === "all" ? "projects" : "projects-" + f;
  }));
  hydrate();
  document.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => {
    navigator.clipboard?.writeText(b.dataset.copy).then(() => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1600); }).catch(() => {});
  }));
  const form = $("#brief");
  if (form) form.addEventListener("submit", e => {
    e.preventDefault();
    const note = $("#formNote"), name = $("#f-name"), email = $("#f-email");
    if (!name.value.trim()) { note.textContent = "Add your name so I know who to reply to."; name.focus(); return; }
    if (!/^\S+@\S+\.\S+$/.test(email.value)) { note.textContent = "Add an email address I can reply to."; email.focus(); return; }
    const need = (form.querySelector('input[name="need"]:checked') || {}).value || "";
    const company = $("#f-company").value.trim(), msg = $("#f-msg").value.trim();
    const body = `Name: ${name.value.trim()}\nEmail: ${email.value.trim()}` + (company ? `\nCompany: ${company}` : "") + (need ? `\nNeed: ${need}` : "") + (msg ? `\n\n${msg}` : "");
    location.href = `mailto:${SITE.email}?subject=${encodeURIComponent("Project enquiry from " + name.value.trim())}&body=${encodeURIComponent(body)}`;
    note.textContent = "Opening your email app to send this. Or write to " + SITE.email + " directly.";
  });
}

/* Lightbox */
const lb = $("#lightbox"); let lbList = [], lbIndex = 0, lbP = null;   // lbList: indexes of this project's uploaded images
function showLb() {
  const k = lbList[lbIndex], rec = SLOTS[slotKey(lbP, k)];
  if (!rec) return closeLb();
  $("#lbImg").src = BLOB + rec.asset; $("#lbImg").alt = lbP.client + " image " + (k + 1);
  $("#lbCount").textContent = `${lbIndex + 1} / ${lbList.length}`;
  $("#lbPrev").hidden = $("#lbNext").hidden = lbList.length < 2;
}
function openLb(k, p) {
  lbP = p || current; if (!lbP) return;
  lbList = lbP.images.map((_, i) => i).filter(i => SLOTS[slotKey(lbP, i)]);
  lbIndex = Math.max(0, lbList.indexOf(k)); if (!lbList.length) return;
  showLb(); lb.hidden = false; document.body.style.overflow = "hidden"; $("#lbClose").focus();
}
function closeLb() { lb.hidden = true; document.body.style.overflow = ""; }
const step = d => { lbIndex = (lbIndex + d + lbList.length) % lbList.length; showLb(); };
$("#lbClose").addEventListener("click", closeLb);
$("#lbPrev").addEventListener("click", () => step(-1));
$("#lbNext").addEventListener("click", () => step(1));
lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });
document.addEventListener("keydown", e => {
  if (lb.hidden) return;
  if (e.key === "Escape") closeLb(); if (e.key === "ArrowRight") step(1); if (e.key === "ArrowLeft") step(-1);
});

/* Theme: light by default; the header button switches to dark and remembers it in this browser */
const themeBtn = $("#themeBtn");
function setTheme(mode, save) {
  const dark = mode === "dark";
  if (dark) document.documentElement.dataset.theme = "dark"; else delete document.documentElement.dataset.theme;
  themeBtn.setAttribute("aria-pressed", String(dark));
  themeBtn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
  themeBtn.querySelector(".t").textContent = dark ? "Light" : "Dark";
  if (save) { try { localStorage.setItem("theme", mode); } catch (e) {} }
}
let savedTheme = null; try { savedTheme = localStorage.getItem("theme"); } catch (e) {}
setTheme(savedTheme === "dark" ? "dark" : "light", false);
themeBtn.addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true));

/* Menu + header */
const menu = $("#mobileNav"), openBtn = $("#menuOpen");
function closeMenu() { menu.hidden = true; openBtn.setAttribute("aria-expanded", "false"); if (lb.hidden) document.body.style.overflow = ""; }
openBtn.addEventListener("click", () => { menu.hidden = false; openBtn.setAttribute("aria-expanded", "true"); document.body.style.overflow = "hidden"; });
$("#menuClose").addEventListener("click", closeMenu);
addEventListener("scroll", () => $("#siteHeader").classList.toggle("scrolled", scrollY > 8), { passive: true });

$("#logo").textContent = $("#logo2").textContent = SITE.name;
$("#copyright").textContent = `© 2026 ${SITE.name}`;
addEventListener("hashchange", render);
render();
</script>
